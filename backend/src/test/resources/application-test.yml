spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.materialmaker.model
  configuration:
    map-underscore-to-camel-case: true

app:
  simulation:
    enabled: true
    delay-ms:
      asset-check: 10
      generate: 10
      finalize: 10
    fail-at-stage: ""
